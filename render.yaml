services:
  - type: web
    name: express-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: express-app-db
          property: connectionString

      - key: NODE_ENV
        value: production

databases:
  - name: express-app-db
    plan: free
